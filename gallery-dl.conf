{
    "#": "gallery-dl configuration file",
    "#": "Documentation: https://gdl-org.github.io/docs/configuration.html",

    "extractor":
    {
        "#": "===============================================================",
        "#": "====    General Extractor Options                            ==",
        "#": "===============================================================",

        "base-directory": "./gallery-dl/",
        "postprocessors": null,
        "skip"          : true,
        "skip-filter"   : null,
        "follow"        : null,

        "user-agent"    : "auto",
        "referer"       : true,
        "headers"       : {},
        "ciphers"       : null,
        "tls12"         : true,
        "browser"       : null,
        "geo-bypass"    : null,
        "proxy"         : null,
        "proxy-env"     : true,
        "source-address": null,
        "retries"       : 4,
        "retry-codes"   : [],
        "timeout"       : 30.0,
        "verify"        : true,
        "truststore"    : false,
        "download"      : true,
        "fallback"      : true,

        "archive"       : null,
        "archive-format": null,
        "archive-prefix": null,
        "archive-pragma": [],
        "archive-event" : ["file"],
        "archive-mode"  : "file",
        "archive-table" : null,

        "cookies"       : null,
        "cookies-select": null,
        "cookies-update": true,

        "file-filter"   : null,
        "file-range"    : null,
        "file-unique"   : false,
        "post-filter"   : null,
        "post-range"    : null,
        "child-filter"  : null,
        "child-range"   : null,
        "child-unique"  : false,

        "blacklist"     : null,
        "whitelist"     : null,
        "tags-blacklist": null,
        "tags-whitelist": null,

        "path-restrict" : "auto",
        "path-replace"  : "_",
        "path-remove"   : "\\u0000-\\u001f\\u007f",
        "path-strip"    : "auto",
        "path-convert"  : null,
        "path-extended" : true,

        "sleep"         : 0,
        "sleep-skip"    : 0,
        "sleep-request" : 0,
        "sleep-extractor": 0,
        "sleep-retries" : "lin=1",
        "sleep-429"     : 60.0,

        "extension-map": {
            "jpeg": "jpg",
            "jpe" : "jpg",
            "jfif": "jpg",
            "jif" : "jpg",
            "jfi" : "jpg",
            "html": "htm"
        },

        "#": "===============================================================",
        "#": "====    Site-specific Extractor Options                      ==",
        "#": "===============================================================",

        "animepictures":
        {
            "sleep"        : "5.0",
            "sleep-request": "1.0"
        },
        "ao3":
        {
            "username": "",
            "password": "",
            "sleep-request": "0.5-1.5",
            "formats": ["pdf"]
        },
        "artstation":
        {
            "external" : false,
            "max-posts": null,
            "mviews"   : true,
            "previews" : false,
            "videos"   : true
        },
        "bluesky":
        {
            "username": "",
            "password": "",
            "api-server": null,
            "include"   : ["media"],
            "quoted"    : false,
            "reposts"   : false,
            "videos"    : true
        },
        "bilibili":
        {
            "sleep-request": "3.0-6.0",
            "livephoto": true
        },
        "coomer":
        {
            "videos": true
        },
        "deviantart":
        {
            "client-id": "",
            "client-secret": "",
            "refresh-token": ""
        },
        "e-hentai":
        {
            "cookies": null
        },
        "exhentai":
        {
            "cookies": null
        },
        "instagram":
        {
            "username": "",
            "password": "",
            "cookies" : null,
            "videos"  : true
        },
        "kemono":
        {
            "videos": true
        },
        "pixiv":
        {
            "username": "",
            "password": "",
            "refresh-token": "",
            "cookies" : null
        },
        "reddit":
        {
            "client-id": "",
            "user-agent": "auto",
            "comments" : 0
        },
        "twitter":
        {
            "username": "",
            "password": "",
            "cookies" : null,
            "retweets": false,
            "videos"  : true
        },
        "youtube":
        {
            "cmdline": []
        }
    },

    "downloader":
    {
        "part"          : true,
        "part-directory": null,
        "part-extension": "part",
        "mtime"         : false,
        "progress"      : 1.0,
        "rate"          : null,
        "retries"       : 4,
        "timeout"       : 30.0
    },

    "output":
    {
        "mode"          : "auto",
        "progress"      : true,
        "short"         : false,
        "verbose"       : false,
        "color"         : false,
        "unicode"       : true
    }
}
