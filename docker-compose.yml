services:
  magnetio-scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8080
      - RPC_SHARED_SECRET=${MAGNETIO_RPC_SECRET:-}
      - REDIS_URL=${REDIS_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  tgdl-bot:
    build: .
    env_file: .env
    depends_on:
      magnetio-scraper:
        condition: service_started
    environment:
      - MAGNETIO_RPC_URL=http://magnetio-scraper:8080/rpc
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 30s
